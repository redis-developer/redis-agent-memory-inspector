<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Redis Agent Memory Inspector</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
        />
        <link rel="stylesheet" href="styles/global.css" />
        <link rel="stylesheet" href="styles/inspector.css" />
    </head>
    <body>
        <!--
            Dark-mode toggle. The hidden checkbox controls the theme via
            `body:has(#theme-toggle:checked) { ... }` overrides in
            global.css. No JS. The label below is the visible button users
            click.
        -->
        <input
            type="checkbox"
            id="theme-toggle"
            class="visually-hidden"
            aria-label="Toggle dark mode"
        />

        <header class="app-header">
            <div class="app-title">
                <img
                    class="app-icon"
                    src="icons/icon.svg"
                    alt=""
                    aria-hidden="true"
                />
                <h1>Redis Agent Memory Inspector</h1>
            </div>
            <div class="header-right">
                <div id="connection-pills" class="connection-pills"></div>
                <!--
                    Templates for pills rendered into #connection-pills above.
                    Cloned + populated in inspector.js (staticPill / pickerPill).
                -->
                <template id="static-pill-template">
                    <span class="pill">
                        <span class="pill-key"></span>
                        <span class="pill-value"></span>
                    </span>
                </template>
                <template id="picker-pill-template">
                    <label class="pill pill-picker">
                        <span class="pill-key"></span>
                        <select class="pill-select"></select>
                    </label>
                </template>
                <button
                    id="refresh-button"
                    class="icon-button"
                    title="Fetch working + long-term memory now"
                    aria-label="Refresh"
                >
                    ↻
                </button>
                <button id="reconfigure-button" class="link-button">
                    Reconfigure
                </button>
                <label
                    for="theme-toggle"
                    class="icon-button theme-toggle-button"
                    title="Toggle dark mode"
                    aria-label="Toggle dark mode"
                    tabindex="0"
                ></label>
            </div>
        </header>

        <main id="inspector-view" class="inspector-view">
            <section class="pane pane-working">
                <header class="pane-header">
                    <div class="pane-title">
                        <h2>Working memory</h2>
                        <span class="pane-subtitle">this session only</span>
                    </div>
                    <div class="pane-header-right">
                        <span id="working-stats" class="pane-stats">-</span>
                        <button
                            id="working-clear-button"
                            class="pane-danger-button"
                            type="button"
                            title="Delete all messages in this session"
                            aria-label="Clear working memory"
                        >Clear</button>
                    </div>
                </header>
                <ul id="working-list" class="card-list" role="list"></ul>
                <!--
                    Template for each message card rendered into the
                    working-list above. Populated in
                    working-memory-panel.js render().
                -->
                <template id="working-card-template">
                    <li>
                        <article class="card">
                            <div class="card-meta">
                                <span class="role-tag"></span>
                                <time hidden></time>
                                <span class="extracted-flag" hidden></span>
                            </div>
                            <p class="card-text"></p>
                        </article>
                    </li>
                </template>
                <section
                    id="working-summary"
                    class="summary-block"
                    hidden
                >
                    <h3>Summary</h3>
                    <p id="working-summary-text"></p>
                </section>
            </section>

            <section class="pane pane-longterm">
                <header class="pane-header">
                    <div class="pane-title">
                        <h2>Long-term memory</h2>
                        <span id="longterm-subtitle" class="pane-subtitle">
                            across all sessions for this user
                        </span>
                    </div>
                    <span id="longterm-stats" class="pane-stats">-</span>
                </header>
                <div
                    class="pane-tabs"
                    role="tablist"
                    aria-label="Long-term memory scope"
                >
                    <button
                        type="button"
                        class="pane-tab"
                        role="tab"
                        aria-selected="false"
                        data-scope="session"
                    >
                        This session
                    </button>
                    <button
                        type="button"
                        class="pane-tab is-active"
                        role="tab"
                        aria-selected="true"
                        data-scope="all"
                    >
                        Across sessions
                    </button>
                </div>
                <div
                    id="ltm-summary-banner"
                    class="summary-banner"
                    hidden
                >
                    <div
                        id="ltm-summary-text"
                        class="summary-banner-text"
                    ></div>
                    <div class="summary-banner-footer">
                        <button
                            type="button"
                            id="ltm-summary-toggle"
                            class="summary-banner-toggle"
                            hidden
                        >
                            Show more
                        </button>
                        <div
                            id="ltm-summary-meta"
                            class="summary-banner-meta"
                        ></div>
                        <button
                            type="button"
                            id="ltm-summary-refresh"
                            class="summary-banner-refresh"
                            title="Recompute summary now (runs the LLM)"
                            aria-label="Refresh summary"
                        >
                            ↻
                        </button>
                    </div>
                </div>
                <div class="pane-toolbar">
                    <div class="search-row">
                        <input
                            id="ltm-search"
                            class="ltm-search"
                            type="search"
                            placeholder="Search memories (semantic + keyword)…"
                            autocomplete="off"
                            spellcheck="false"
                        />
                        <label
                            class="optimize-toggle"
                            title="Pre-process the search query with an LLM to expand and refine it before searching."
                        >
                            <input id="ltm-optimize" type="checkbox" />
                            <span>optimize</span>
                        </label>
                    </div>
                    <div id="ltm-active-filters" class="active-filters"></div>
                    <!--
                        Template for active-filter pills rendered into
                        #ltm-active-filters above. Cloned per active filter
                        in long-term-memory-panel.js renderActiveFilters().
                    -->
                    <template id="filter-pill-template">
                        <span class="filter-pill">
                            <span class="filter-pill-key"></span>
                            <span class="filter-pill-value"></span>
                            <button
                                type="button"
                                class="filter-pill-remove"
                                title="Remove this filter"
                            >×</button>
                        </span>
                    </template>
                </div>
                <ul id="longterm-list" class="card-list" role="list"></ul>
                <!--
                    Templates for cards + chip rows + chips rendered into
                    the longterm-list above. Populated in
                    long-term-memory-panel.js render() / renderChipRow().
                -->
                <template id="longterm-card-template">
                    <li>
                        <article class="card">
                            <div class="card-meta">
                                <span class="type-badge"></span>
                                <time hidden></time>
                                <span class="card-meta-session" hidden>
                                    from session: <code></code>
                                </span>
                                <span class="card-id" hidden></span>
                                <span class="score-badge" hidden></span>
                                <button
                                    type="button"
                                    class="card-delete-button"
                                    title="Delete this memory"
                                    aria-label="Delete memory"
                                    hidden
                                >✕</button>
                            </div>
                            <p class="card-text"></p>
                        </article>
                    </li>
                </template>
                <template id="chip-row-template">
                    <div class="chip-row">
                        <span class="chip-row-label"></span>
                        <div class="chip-row-chips"></div>
                    </div>
                </template>
                <template id="chip-template">
                    <button type="button" class="chip"></button>
                </template>
            </section>
        </main>

        <footer class="app-footer">
            <output
                id="status-line"
                class="status-line"
                role="status"
                aria-live="polite"
            >Ready.</output>
        </footer>

        <script type="module" src="inspector.js"></script>
    </body>
</html>
