<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Redis Agent Memory Inspector</title>
        <link
            rel="preconnect"
            href="https://fonts.googleapis.com"
        />
        <link
            rel="preconnect"
            href="https://fonts.gstatic.com"
            crossorigin
        />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
        />
        <link rel="stylesheet" href="index.css" />
    </head>
    <body>
        <!--
            Dark-mode toggle. The hidden checkbox controls the theme via
            `body:has(#theme-toggle:checked) { ... }` overrides in index.css.
            No JS. The label below is the visible button users click.
        -->
        <input
            type="checkbox"
            id="theme-toggle"
            class="visually-hidden"
            aria-label="Toggle dark mode"
        />

        <header class="app-header">
            <div class="app-title">
                <img
                    class="app-icon"
                    src="icons/icon.svg"
                    alt=""
                    aria-hidden="true"
                />
                <h1>Redis Agent Memory Inspector</h1>
            </div>
            <div class="header-right">
                <div id="connection-pills" class="connection-pills" hidden></div>
                <button
                    id="refresh-btn"
                    class="icon-btn"
                    title="Fetch working + long-term memory now"
                    aria-label="Refresh"
                    hidden
                >
                    ↻
                </button>
                <button id="reconfigure-btn" class="link-btn" hidden>
                    Reconfigure
                </button>
                <label
                    for="theme-toggle"
                    class="icon-btn theme-toggle-btn"
                    title="Toggle dark mode"
                    aria-label="Toggle dark mode"
                    tabindex="0"
                ></label>
            </div>
        </header>

        <!-- Connect panel: shown when no config is available. -->
        <section id="connect-panel" class="connect-panel" hidden>
            <div class="connect-card">
                <div class="field">
                    <span class="field-label">Backend</span>
                    <div class="backend-options">
                        <label class="backend-option">
                            <input
                                type="radio"
                                name="cfg-backend"
                                value="oss"
                                checked
                            />
                            <span>OSS server</span>
                        </label>
                        <label class="backend-option">
                            <input
                                type="radio"
                                name="cfg-backend"
                                value="cloud"
                            />
                            <span>Redis Cloud</span>
                        </label>
                    </div>
                </div>

                <label class="field">
                    <span class="field-label">Redis Agent Memory Server URL / Endpoint</span>
                    <span class="field-row">
                        <input
                            id="cfg-url"
                            type="url"
                            placeholder="http://localhost:8000"
                            autocomplete="off"
                            spellcheck="false"
                        />
                        <span id="url-health" class="health-badge"></span>
                    </span>
                </label>

                <label class="field cloud-only" id="field-store-id" hidden>
                    <span class="field-label">Store ID</span>
                    <input
                        id="cfg-store-id"
                        type="text"
                        placeholder="cf1dbfd...d5afd0"
                        autocomplete="off"
                        spellcheck="false"
                    />
                </label>

                <label class="field cloud-only" id="field-api-key" hidden>
                    <span class="field-label">API Key</span>
                    <input
                        id="cfg-api-key"
                        type="password"
                        placeholder="mem1_…"
                        autocomplete="off"
                        spellcheck="false"
                    />
                </label>

                <label class="field cloud-only" id="field-proxy-url" hidden>
                    <span class="field-label">
                        Proxy URL
                        <span class="field-hint">
                            optional - only use if you are running the proxy server to route requests to Redis Agent Memory service locally (e.g. http://localhost:8787). Else, leave this blank.
                        </span>
                    </span>
                    <input
                        id="cfg-proxy-url"
                        type="url"
                        placeholder="leave empty to use the default proxy"
                        autocomplete="off"
                        spellcheck="false"
                    />
                </label>

                <label class="field" id="field-namespace" hidden>
                    <span class="field-label">Namespace</span>
                    <select id="cfg-namespace"></select>
                </label>

                <label class="field">
                    <span class="field-label">
                        User ID
                        <span class="field-hint" id="cfg-user-hint"></span>
                    </span>
                    <input
                        id="cfg-user"
                        type="text"
                        list="cfg-user-options"
                        placeholder="Pick or type a user_id…"
                        autocomplete="off"
                        spellcheck="false"
                    />
                    <datalist id="cfg-user-options"></datalist>
                </label>

                <label class="field">
                    <span class="field-label">
                        Session ID
                        <span class="field-hint" id="cfg-session-hint"></span>
                    </span>
                    <input
                        id="cfg-session"
                        type="text"
                        list="cfg-session-options"
                        placeholder="Pick or type a session_id…"
                        autocomplete="off"
                        spellcheck="false"
                    />
                    <datalist id="cfg-session-options"></datalist>
                </label>

                <label class="field">
                    <span class="field-label">
                        Working memory refresh
                        <span class="field-hint">in seconds - how often to re-fetch the live conversation (default: 3)</span>
                    </span>
                    <input
                        id="cfg-working-refresh"
                        type="number"
                        min="1"
                        max="3600"
                        step="1"
                        value="3"
                    />
                </label>

                <label class="field">
                    <span class="field-label">
                        Long-term memory refresh
                        <span class="field-hint">in seconds - how often to re-fetch durable memories (default: 5)</span>
                    </span>
                    <input
                        id="cfg-longterm-refresh"
                        type="number"
                        min="1"
                        max="3600"
                        step="1"
                        value="5"
                    />
                </label>

                <div class="connect-actions">
                    <button id="connect-btn" class="primary-btn" type="button" disabled>
                        Connect
                    </button>
                </div>

            </div>
        </section>

        <!-- Inspector view: shown when connected. -->
        <main id="inspector-view" class="inspector-view" hidden>
            <section class="pane pane-working">
                <header class="pane-header">
                    <div class="pane-title">
                        <h2>Working memory</h2>
                        <span class="pane-subtitle">this session only</span>
                    </div>
                    <div class="pane-header-right">
                        <span id="working-stats" class="pane-stats">-</span>
                        <button
                            id="working-clear-btn"
                            class="pane-danger-btn"
                            type="button"
                            title="Delete all messages in this session"
                            aria-label="Clear working memory"
                        >Clear</button>
                    </div>
                </header>
                <ul id="working-list" class="card-list" role="list"></ul>
                <section
                    id="working-summary"
                    class="summary-block"
                    hidden
                >
                    <h3>Summary</h3>
                    <p id="working-summary-text"></p>
                </section>
            </section>

            <section class="pane pane-longterm">
                <header class="pane-header">
                    <div class="pane-title">
                        <h2>Long-term memory</h2>
                        <span id="longterm-subtitle" class="pane-subtitle">
                            across all sessions for this user
                        </span>
                    </div>
                    <span id="longterm-stats" class="pane-stats">-</span>
                </header>
                <div
                    class="pane-tabs"
                    role="tablist"
                    aria-label="Long-term memory scope"
                >
                    <button
                        type="button"
                        class="pane-tab"
                        role="tab"
                        aria-selected="false"
                        data-scope="session"
                    >
                        This session
                    </button>
                    <button
                        type="button"
                        class="pane-tab is-active"
                        role="tab"
                        aria-selected="true"
                        data-scope="all"
                    >
                        Across sessions
                    </button>
                </div>
                <div
                    id="ltm-summary-banner"
                    class="summary-banner"
                    hidden
                >
                    <div
                        id="ltm-summary-text"
                        class="summary-banner-text"
                    ></div>
                    <div class="summary-banner-footer">
                        <button
                            type="button"
                            id="ltm-summary-toggle"
                            class="summary-banner-toggle"
                            hidden
                        >
                            Show more
                        </button>
                        <div
                            id="ltm-summary-meta"
                            class="summary-banner-meta"
                        ></div>
                        <button
                            type="button"
                            id="ltm-summary-refresh"
                            class="summary-banner-refresh"
                            title="Recompute summary now (runs the LLM)"
                            aria-label="Refresh summary"
                        >
                            ↻
                        </button>
                    </div>
                </div>
                <div class="pane-toolbar">
                    <div class="search-row">
                        <input
                            id="ltm-search"
                            class="ltm-search"
                            type="search"
                            placeholder="Search memories (semantic + keyword)…"
                            autocomplete="off"
                            spellcheck="false"
                        />
                        <label
                            class="optimize-toggle"
                            title="Pre-process the search query with an LLM to expand and refine it before searching. AMS does not return the rewritten query."
                        >
                            <input id="ltm-optimize" type="checkbox" />
                            <span>optimize</span>
                        </label>
                    </div>
                    <div id="ltm-active-filters" class="active-filters"></div>
                </div>
                <ul id="longterm-list" class="card-list" role="list"></ul>
            </section>
        </main>

        <footer class="app-footer">
            <output
                id="status-line"
                class="status-line"
                role="status"
                aria-live="polite"
            >Ready.</output>
        </footer>

        <script type="module" src="index.js"></script>
    </body>
</html>
